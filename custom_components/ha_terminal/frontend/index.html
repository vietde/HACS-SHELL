<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HA Terminal</title>
<link rel="stylesheet" href="/api/ha_terminal/assets/xterm.css">
<link rel="stylesheet" href="/api/ha_terminal/assets/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">⌨️ HA Terminal</div>
  <nav class="tabs">
    <button id="tab-terminal" class="tab active">Terminal</button>
    <button id="tab-files" class="tab">Files</button>
  </nav>
  <div class="actions">
    <span id="status" class="status disconnected">Disconnected</span>
    <button id="btn-reconnect" class="btn" title="Reconnect the terminal">Reconnect</button>
    <button id="btn-clear" class="btn" title="Clear the terminal screen">Clear</button>
  </div>
</header>

<main id="view-terminal" class="view">
  <div id="terminal"></div>
  <div id="term-overlay" class="overlay hidden">
    <div>
      <p id="overlay-text">Terminal closed.</p>
      <button id="btn-overlay-reconnect" class="btn primary">Reconnect</button>
    </div>
  </div>
</main>

<main id="view-files" class="view hidden">
  <div class="filebar">
    <button id="btn-files-up" class="btn" title="Go to the parent folder">⬆ Up</button>
    <span id="files-path" class="files-path">/config</span>
    <button id="btn-files-refresh" class="btn">Refresh</button>
    <label class="btn upload-label">Upload
      <input id="files-upload" type="file" multiple hidden>
    </label>
    <span id="files-status" class="files-status"></span>
  </div>
  <div id="files-list" class="files-list"></div>
  <section class="keys-section">
    <h2>SSH keys</h2>
    <p class="keys-hint">Paste a public key to log in over SSH without a password.
      Keys are stored in <code>/config/.ssh/authorized_keys</code> and only work for
      Home Assistant admin users.</p>
    <textarea id="keys-input" rows="3" spellcheck="false"
      placeholder="ssh-ed25519 AAAA... you@laptop"></textarea>
    <div class="keys-row">
      <button id="btn-keys-add" class="btn primary">Add key</button>
      <span id="keys-status" class="files-status"></span>
    </div>
    <div id="keys-list" class="keys-list"></div>
  </section>
</main>

<script src="/api/ha_terminal/assets/xterm.min.js"></script>
<script src="/api/ha_terminal/assets/addon-fit.js"></script>
<script src="/api/ha_terminal/assets/app.js"></script>
</body>
</html>
